            # =========== Object-centric / Instance Datasets ===========
            # 1. TrashCan
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/TrashCan_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/TrashCan_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 2. iShape
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/iShape_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/iShape_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 3. ZeroWaste-f
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/ZeroWaste-f_SAM2/train/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/ZeroWaste-f_SAM2/train/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 4. LVIS
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/LVIS_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/LVIS_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 5. DOORS
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/DOORS_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/DOORS_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 6. BBBC038v1
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/BBBC038v1_SAM2/train/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/BBBC038v1_SAM2/train/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 7. PPDLS
            - _target_: training.dataset.vos_dataset.VOSDataset
