# @package _global_

scratch:
  resolution: 1024
  train_batch_size: 2
  num_train_workers: 4
  num_frames: 1
  val_num_frames: 1
  max_num_objects: 3
  val_max_videos: 16
  # base_lr: 5.0e-6
  # vision_lr: 3.0e-06
  base_lr: 1.0e-6
  vision_lr: 1.0e-07
  phases_per_epoch: 1
  num_epochs: 20
  
  mmd_config:
    method: spatial_mmd
    patch_size: 16
    temperature: 0.5
    kernel_bandwidth: 0.3
    use_checkpoint: false

dataset:
  # PATHS to Dataset
  img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/JPEGImages # PATH to MOSE JPEGImages folder
  gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/Annotations # PATH to MOSE Annotations folder
  file_list_txt: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/training/assets/MOSE_sample_train_list.txt # Optional PATH to filelist containing a subset of videos to be used for training
  multiplier: 4  # Reduced from 4 for faster sweep
  # PATHS to MOSE-val dataset
  val_img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/JPEGImages
  val_gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/Annotations
  val_file_list_txt: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/training/assets/MOSE_sample_val_list.txt
  val_multiplier: 1


# Video transforms
vos:
  train_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomHorizontalFlip
          consistent_transform: True
        - _target_: training.dataset.transforms.RandomAffine
          degrees: 25
          shear: 20
          # scale: [0.9, 1.1]
          # translate: [0.05, 0.05]
          image_interpolation: bilinear
          consistent_transform: True
          num_tentatives: 8
        - _target_: training.dataset.transforms.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter
          consistent_transform: True
          brightness: 0.1
          contrast: 0.03
          saturation: 0.03
          hue: null
        - _target_: training.dataset.transforms.RandomGrayscale
          p: 0.05
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter
          consistent_transform: False
          brightness: 0.1
          contrast: 0.05
          saturation: 0.05
          hue: null
        - _target_: training.dataset.transforms.ToTensorAPI
        - _target_: training.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

  val_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomResizeAPI   # same resize as train
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True          # single deterministic resize
        - _target_: training.dataset.transforms.ToTensorAPI
        - _target_: training.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std:  [0.229, 0.224, 0.225] 

trainer:
  _target_: training.trainer.Trainer
  mode: train
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  actual_max_epochs: 20
  val_epoch_freq: 1
  accelerator: cuda
  seed_value: 123
  gradient_accumulation_steps: 2
  # Gradient conflict monitoring (for debugging AUE training)
  gradient_conflict_monitor:
    enabled: false  # Enable for debugging, disable for production (adds overhead)
    sample_rate: 0.05  # Only compute every 1/0.05 = 20 steps
    target_params: ["bndl", "iou"]  # Parameter name patterns to monitor
  cuda:
    allow_tf32: true
    cudnn_benchmark: true

  model:
    _target_: training.model.sam2.SAM2Train
    image_encoder:
      _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
      scalp: 1
      trunk:
        _target_: sam2.modeling.backbones.hieradet.Hiera
        embed_dim: 112
        num_heads: 2
        drop_path_rate: 0.1
      neck:
        _target_: sam2.modeling.backbones.image_encoder.FpnNeck
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 256
          normalize: true
          scale: null
          temperature: 10000
        d_model: 256
        backbone_channel_list: [896, 448, 224, 112]
        fpn_top_down_levels: [2, 3]  # output level 0 and 1 directly use the backbone features
        fpn_interp_model: nearest

    memory_attention:
      _target_: sam2.modeling.memory_attention.MemoryAttention
      d_model: 256
      pos_enc_at_input: true
      layer:
        _target_: sam2.modeling.memory_attention.MemoryAttentionLayer
        activation: relu
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        self_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
        d_model: 256
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        cross_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          kv_in_dim: 64
      num_layers: 4

    memory_encoder:
        _target_: sam2.modeling.memory_encoder.MemoryEncoder
        out_dim: 64
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 64
          normalize: true
          scale: null
          temperature: 10000
        mask_downsampler:
          _target_: sam2.modeling.memory_encoder.MaskDownSampler
          kernel_size: 3
          stride: 2
          padding: 1
        fuser:
          _target_: sam2.modeling.memory_encoder.Fuser
          layer:
            _target_: sam2.modeling.memory_encoder.CXBlock
            dim: 256
            kernel_size: 7
            padding: 3
            layer_scale_init_value: 1e-6
            use_dwconv: True  # depth-wise convs
          num_layers: 2

    num_maskmem: 7
    image_size: ${scratch.resolution}
    # apply scaled sigmoid on mask logits for memory encoder, and directly feed input mask as output mask
    sigmoid_scale_for_mem_enc: 20.0
    sigmoid_bias_for_mem_enc: -10.0
    use_mask_input_as_output_without_sam: false  # Must be false when use_bndl_for_pixels=True (incompatible)
    # Memory
    directly_add_no_mem_embed: true
    no_obj_embed_spatial: true
    # use high-resolution feature map in the SAM mask decoder
    use_high_res_features_in_sam: true
    # output 3 masks on the first click on initial conditioning frames
    multimask_output_in_sam: true
    # SAM heads
    iou_prediction_use_sigmoid: True
    # cross-attend to object pointers from other frames (based on SAM output tokens) in the encoder
    use_obj_ptrs_in_encoder: true
    add_tpos_enc_to_obj_ptrs: true
    proj_tpos_enc_in_obj_ptrs: true
    use_signed_tpos_enc_to_obj_ptrs: true
    only_obj_ptrs_in_the_past_for_eval: true
    # object occlusion prediction
    pred_obj_scores: true
    pred_obj_scores_mlp: true
    fixed_no_obj_ptr: true
    # multimask tracking settings
    multimask_output_for_tracking: true
    use_multimask_token_for_obj_ptr: true
    multimask_min_pt_num: 0
    multimask_max_pt_num: 1
    use_mlp_for_obj_ptr_proj: true
    # === BNDL_CONFIG_START ===
    # BNDL (always uses hyper_in only mode)
    use_bndl_for_pixels: true
    use_ur_ern_for_pixels: false
    sam_mask_decoder_extra_args:
      bndl_factor_z: 0.0
      bndl_factor_w: 0.0
    # === BNDL_CONFIG_END ===
    # Compilation flag
    # Freeze image encoder to save memory
    # === IMPORTANT: Conv-LoRA Configuration ===
    freeze_image_encoder: true  # true = PEFT (only train LoRA, ~2-3% params), false = joint fine-tuning (train all, ~33% params)
    freeze_image_encoder_epochs: 20  # Freeze image encoder for first N epochs (0 = disabled)
    # Unfreeze specific components for adaptation (e.g. "neck", "trunk_last_stage")
    unfreeze_image_encoder_components: []
    
    epsilon_decay_start_epoch: 0   # Epoch to start decay (0 = disabled)
    epsilon_decay_end_epoch: 0     # Epoch to reach minimum (0 = use actual_max_epochs)
    epsilon_min_ratio: 0.1         # Final epsilon = initial * min_ratio

    # === LORA_CONFIG_START ===
    # LoRA: Parameter-efficient fine-tuning
    use_lora: false
    lora_rank: 4
    lora_alpha: 16.0
    lora_dropout: 0.1
    lora_target_modules:  # Layers to inject LoRA (Match FS-SAM2: qkv, proj)
      - "qkv" 
      - "proj"
    # === LORA_CONFIG_END ===
    
    # === MAX_OBJECTS_CONFIG_START ===
    # Max number of objects (matches dataset sampler for memory efficiency)
    max_num_objects: ${scratch.max_num_objects}
    # === MAX_OBJECTS_CONFIG_END ===

    # === AUE_GCN_CONFIG_START ===
    # AUE (Adversarial Uncertainty Estimation) with Style-based augmentation
    use_aue: true
    # Style Adversarial options (alternative to AUE, for domain generalization)
    use_style_adv: true
    style_adv_mode: "image_level"  # "image_level" or "feature_level"
    style_adv_epsilon: 0.3
    style_adv_use_gt_region_style: true
    
    # Multi-object style attack control
    adv_use_multi_object: true
    adv_enable_background: true
    
    # Global-Local Mixed Style Adversarial
    style_adv_use_global_local_mix: false
    style_adv_global_epsilon: 0.5
    style_adv_global_weight: 0.5

    # GCN-based multi-object style refinement
    style_adv_use_gcn: true  # Not needed for global-only style
    style_adv_gcn_hidden_dim: 64
    style_adv_gcn_num_layers: 2
    style_adv_gcn_edge_threshold: 0.0
    style_adv_gcn_use_semantic_edges: true
    style_adv_gcn_use_background_edges: true
    style_adv_gcn_distance_threshold: 1.0
    style_adv_gcn_use_boundary_distance: true
    style_adv_gcn_use_visual_features: true
    style_adv_gcn_feature_dim: 256  # Feature dimension (matches backbone_fpn[-1] d_model)
    
    # Deformation Adversarial (feature-level, memory encoder based)
    use_deform_adv: true
    deform_adv_epsilon: 0.15
    deform_adv_use_soft_composite: true
    deform_adv_temperature: 1.0
    deform_adv_use_gcn: false
    deform_adv_gcn_num_layers: 2
    deform_adv_num_deform_groups: 4
    deform_adv_init_from_memory_encoder: true  # Initialize from pretrained memory encoder
    deform_adv_freeze_encoder_components: true  # Freeze all encoder components (mask_encoder, img_feat_proj, fuser) to prevent GRL gradient instability
    deform_adv_zero_mean_offsets: true  # Remove global translation while keeping local warps
    deform_adv_local_offset_gain: 1.0
    
    # Adversarial Pipeline Ordering
    adversarial_attack_order: ["style", "deform"]
    
    # Analytic uncertainty computation (from Weibull parameters)
    # true = use analytic uncertainty (with gradients to BNDL, bidirectional optimization)
    # false = use sampling uncertainty (detached, gradients only to encoder)
    aue_use_analytic_uncertainty: true  
    # === AUE_GCN_CONFIG_END ===

    ####### Training specific params #######
    # box/point input and corrections
    prob_to_use_pt_input_for_train: 0.5
    prob_to_use_pt_input_for_eval: 0.0
    prob_to_use_box_input_for_train: 0.5  # 0.5*0.5 = 0.25 prob to use box instead of points
    prob_to_use_box_input_for_eval: 0.0
    prob_to_sample_from_gt_for_train: 0.1  # with a small prob, sampling correction points from GT mask instead of prediction errors
    num_frames_to_correct_for_train: 2  # iteratively sample on random 1~2 frames (always include the first frame)
    num_frames_to_correct_for_eval: 1  # only iteratively sample on first frame
    rand_frames_to_correct_for_train: True  # random #init-cond-frame ~ 2
    add_all_frames_to_correct_as_cond: True  # when a frame receives a correction click, it becomes a conditioning frame (even if it's not initially a conditioning frame)
    # maximum 2 initial conditioning frames
    num_init_cond_frames_for_train: 2
    rand_init_cond_frames_for_train: True  # random 1~2
    num_correction_pt_per_frame: 7
    use_act_ckpt_iterative_pt_sampling: false
    use_aue_decoder_checkpoint: false
     
    num_init_cond_frames_for_eval: 1  # only mask on the first frame
    forward_backbone_per_frame_for_eval: True
    

  data:
    train:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      batch_sizes:
        - ${scratch.train_batch_size}

      datasets:
        - _target_: training.dataset.utils.RepeatFactorWrapper
          dataset:
            _target_: training.dataset.utils.ConcatDataset
            datasets:
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.train_transforms}
              training: true
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${dataset.img_folder}
                gt_folder: ${dataset.gt_folder}
                file_list_txt: ${dataset.file_list_txt}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: ${dataset.multiplier}
      shuffle: True
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      persistent_workers: True  # Keep workers alive between epochs
      prefetch_factor: 2  # Batches to prefetch per worker
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all

    # =============================================================================
    # ZS Validation: 23 OOD datasets for zero-shot evaluation during sweep
    # Each dataset limited to max_videos: 8 for manageable validation time (~184 samples)
    # Dice loss serves as proxy for J&F metric (monotonic relationship)
    # =============================================================================
    val:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: 1
      batch_sizes:
        - 1
      datasets:
        - _target_: training.dataset.utils.ConcatDataset
