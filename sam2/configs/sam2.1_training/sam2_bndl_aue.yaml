                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/Hypersim_SAM2/train/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/Hypersim_SAM2/train/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 13. STREETS
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/STREETS_SAM2/train/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/STREETS_SAM2/train/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
