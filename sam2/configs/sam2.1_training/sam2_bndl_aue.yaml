                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/IBD_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/IBD_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 9. PIDRay
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/PIDRay_SAM2/test/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/PIDRay_SAM2/test/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # =========== Scene-centric / Stuff Datasets ===========
            # 10. CITYSCAPES
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/CITYSCAPES_SAM2/val/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/CITYSCAPES_SAM2/val/Annotations
                max_videos: ${scratch.val_max_videos}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.val_num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: 1

            # 11. ADE20K
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.val_transforms}
              training: false
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/ADE20K_SAM2/validation/JPEGImages
