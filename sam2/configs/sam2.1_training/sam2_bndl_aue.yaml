                img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/DRAM_SAM2/test/JPEGImages
                gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/DRAM_SAM2/test/Annotations
