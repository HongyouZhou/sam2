      shuffle: False
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: False
      persistent_workers: True  # Keep workers alive between epochs
      prefetch_factor: 2  # Batches to prefetch per worker
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: val   

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    # === Attacker Optimizer Configuration ===
    # Separate optimizer for Style/Deform attacker networks
    # Uses cosine annealing LR schedule (1e-3 → 1e-4)
    attacker_optim:
      lr_start: 1.0e-3
      lr_end: 1.0e-4
      weight_decay: 0.0

    param_group_modifiers:
      - _target_: training.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: 0.9
        apply_to: 'image_encoder.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    # options:
    #   lr:
    #     - scheduler:
    #         _target_: fvcore.common.param_scheduler.CosineParamScheduler
    #         start_value: ${scratch.base_lr}
    #         end_value: ${divide:${scratch.base_lr},10}
    #     - scheduler:
    #         _target_: fvcore.common.param_scheduler.CosineParamScheduler
    #         start_value: ${scratch.vision_lr}
    #         end_value: ${divide:${scratch.vision_lr},10}
    #       param_names:
    #         - 'image_encoder.*'
    #   weight_decay:
    #     - scheduler:
    #         _target_: fvcore.common.param_scheduler.ConstantParamScheduler
    #         value: 0.1
    #     - scheduler:
    #         _target_: fvcore.common.param_scheduler.ConstantParamScheduler
    #         value: 0.0
    #       param_names:
    #         - '*bias*'
    #       module_cls_names: ['torch.nn.LayerNorm']

    options:
      lr:
        # 默认组（未被下面命中者）
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.base_lr}
            end_value: ${divide:${scratch.base_lr},10}

        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: 1.0e-4
            end_value: 1.0e-5
          param_names:
            - 'sam_mask_decoder.pixel_bndl.*'
          optional: true  # Skip if BNDL is disabled (use_bndl_for_pixels=false)

        # UR-ERN head: higher learning rate (optional - skipped when use_ur_ern_for_pixels=false)
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: 1.0e-3
            end_value: 2.0e-4
          param_names:
            - 'sam_mask_decoder.ur_ern_head.*'
          optional: true  # Skip if no UR-ERN params exist

        # LoRA params: higher learning rate (optional - skipped when use_lora=false)
        # PEFT uses 'lora_A' and 'lora_B' naming convention
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: 1.0e-4
            end_value: 1.0e-5
          param_names:
            - '*lora_A*'
            - '*lora_B*'
          optional: true  # Skip if no LoRA params exist

        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.vision_lr}
            end_value: ${divide:${scratch.vision_lr},10}
          param_names:
            - image_encoder.*
          exclude_param_names:
            - '*lora_A*'
            - '*lora_B*'

      weight_decay:
        # Default weight decay
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.1
        # Bias: no weight decay
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
        # LayerNorm: no weight decay
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          module_cls_names: ['torch.nn.LayerNorm']
          exclude_param_names: ['*bias*']

  loss:
    all:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss:
        _target_: training.loss_fns.MultiStepMultiMasksAndIous
        weight_dict:
          loss_mask: 20.0
          loss_dice: 1.0
          loss_iou: 1.0
          loss_class: 1.0
        supervise_all_iou: true
        iou_use_l1_loss: true
        pred_obj_scores: true
        focal_gamma_obj_score: 0.0
        focal_alpha_obj_score: -1.0
      bndl_loss:
        _target_: training.loss_bndl.BNDLLoss
        kl_weight: 1e-11
        kl_weight_x: 1e-11
        kl_weight_w: 1e-11
        prior_gamma_shape: 1.0
        prior_gamma_scale: 3.0
        ur_weight: 0.0
      mmd_loss:
        _target_: training.loss_mmd.MMDCalibrationLoss
        config: ${scratch.mmd_config}
      aue_loss:
        _target_: training.loss_aue.AUELoss
        task_weight: 1.0       # Task loss updates SAM + attacker (via GRL) - set 0 for isolation
        bndl_weight: 0.0
        mmd_weight: 0.0
        attacker_uncertainty_weight: 0.0  # Attacker maximizes uncertainty (NO BNDL update)
        attacker_mmd_weight: 0.3  # Attacker maximizes miscalibration (NO SAM/BNDL update)
        attacker_task_weight: 0.0  # NEW: Task loss only updates attacker (NO SAM update) - complete isolation
        mmd_config: ${scratch.mmd_config}
      # === UR-ERN Loss Configuration ===
      # UR-ERN paper (arXiv:2401.01484) Eq. 11: L^UR-ERN = L^NLL + λ·L^R + λ₁·L^U
      # NOTE: UR-ERN is mutually exclusive with BNDL (use_ur_ern_for_pixels vs use_bndl_for_pixels)
      # Set ur_ern_weight > 0 and use_ur_ern_for_pixels=true in model config to enable
      # Override via Hydra: ++trainer.loss.all.ur_ern_loss._target_=training.loss_ur_ern.URERNLoss
      ur_ern_loss: null  # Placeholder for val interpolation; override with ++ prefix when enabling UR-ERN
      sam_weight: 1.0
      bndl_weight: 0.0
      mmd_weight: 0.6
      aue_weight: 0.0
      ur_ern_weight: 0.0  # Disabled by default (this config uses BNDL), set > 0 for UR-ERN baseline
      weight_schedule:
        - until_epoch: 4
          bndl_weight: 0.0
          mmd_weight: 0.0
          aue_weight: 0.0
        - until_epoch: 6
          sam_weight: 1.0
          bndl_weight: 0.05
          mmd_weight: 0.0
          aue_weight: 0.0
        - until_epoch: null
          sam_weight: 0.8
          bndl_weight: 0.05
          mmd_weight: 0.0
          aue_weight: 0.2
    val:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss: ${trainer.loss.all.sam_loss}
      bndl_loss: ${trainer.loss.all.bndl_loss}
      mmd_loss: ${trainer.loss.all.mmd_loss}
      aue_loss: ${trainer.loss.all.aue_loss}
      ur_ern_loss: ${trainer.loss.all.ur_ern_loss}
      sam_weight: 1.0
      bndl_weight: 1.0
      mmd_weight: 0.0       # Log MMD loss
      aue_weight: 0.0       # Do not add to core_loss during validation
      ur_ern_weight: 0.0    # Disabled by default
      prefix_keys: False
    # val:
    #   _target_: training.loss_fns.MultiStepMultiMasksAndIous
    #   weight_dict: ${trainer.loss.all.sam_loss.weight_dict}
    #   supervise_all_iou: ${trainer.loss.all.sam_loss.supervise_all_iou}
    #   iou_use_l1_loss: ${trainer.loss.all.sam_loss.iou_use_l1_loss}
    #   pred_obj_scores: ${trainer.loss.all.sam_loss.pred_obj_scores}
    #   focal_gamma_obj_score: ${trainer.loss.all.sam_loss.focal_gamma_obj_score}
    #   focal_alpha_obj_score: ${trainer.loss.all.sam_loss.focal_alpha_obj_score}

  distributed:
    backend: nccl
    find_unused_parameters: True

  logging:
    # log_level_primary: "INFO"
    tensorboard_writer:
      _target_: training.utils.logger.make_tensorboard_logger
      log_dir:  ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 5  # Aggressive flush to prevent image loss (was 120)
      should_log: True
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10
    log_scalar_frequency: 10
    log_visual_frequency: 5
    visualize_bndl: false
    visualize_aue: true
    style_aue_visual_frequency: 5
    uncertainty_metric: ["entropy", "nll"]
    visualize_pavpu_overlay: false
    enable_pavpu_eval: true
    uncertainty_sample_num: 50
    # Pixel-level PAvPU statistics configuration
    correlation_foreground_dilation: 12
    correlation_per_pixel: true
    correlation_use_full_image: false

  # initialize from a SAM 2 checkpoint
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0 # 0 only last checkpoint is saved.
    model_weight_initializer:
      _partial_: True
      _target_: training.utils.checkpoint_utils.load_state_dict_into_model
      strict: False
      ignore_missing_keys: []
      ignore_unexpected_keys: []
      checkpoint_kernels:
        - _target_: training.utils.checkpoint_utils.CkptExcludeKernel
          key_pattern:
            - 'sam_mask_decoder.output_hypernetworks_mlps.*'
      state_dict:
        _target_: training.utils.checkpoint_utils.load_checkpoint_and_apply_kernels
        checkpoint_path: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/checkpoints/sam2.1_hiera_base_plus.pt # PATH to SAM 2.1 checkpoint
        ckpt_state_dict_keys: ['model']

launcher:
  num_nodes: 1
  gpus_per_node: 8
  # NOTE: experiment_log_dir is automatically set by train_and_zs.sh based on BNDL_AUE_VER
  # To change version, edit BNDL_AUE_VER in scripts/train_and_zs.sh (no need to edit here)
  experiment_log_dir: ${oc.env:PROJECT_HOME}/dev/ada_samp/logs/sam2/sam2_bndl_aue_017_bndl  # Default fallback, will be overridden

# SLURM args if running on a cluster
submitit:
  partition: null
  account: null
  qos: null
  cpus_per_task: 10
  use_cluster: false
  timeout_hour: 24
  name: null
  port_range: [10000, 65000]
