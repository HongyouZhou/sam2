# @package _global_
# BNDL + DSU (non-adversarial style augmentation baseline)
# Same training hyperparams as sam2_bndl_aue.yaml for fair comparison.
# Only difference: DSU replaces AUE adversarial perturbations.

scratch:
  resolution: 1024
  train_batch_size: 2
  num_train_workers: 4
  num_frames: 1
  val_num_frames: 1
  max_num_objects: 3
  val_max_videos: 16
  base_lr: 1.0e-6
  vision_lr: 1.0e-07
  phases_per_epoch: 1
  num_epochs: 20

dataset:
  img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/JPEGImages
  gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/Annotations
  file_list_txt: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/training/assets/MOSE_sample_train_list.txt
  multiplier: 4
  val_img_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/JPEGImages
  val_gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/MOSE_release/train/Annotations
  val_file_list_txt: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/training/assets/MOSE_sample_val_list.txt
  val_multiplier: 1

vos:
  train_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomHorizontalFlip
          consistent_transform: True
        - _target_: training.dataset.transforms.RandomAffine
          degrees: 25
          shear: 20
          image_interpolation: bilinear
          consistent_transform: True
          num_tentatives: 8
        - _target_: training.dataset.transforms.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter
          consistent_transform: True
          brightness: 0.1
          contrast: 0.03
          saturation: 0.03
          hue: null
        - _target_: training.dataset.transforms.RandomGrayscale
          p: 0.05
          consistent_transform: True
        - _target_: training.dataset.transforms.ColorJitter
          consistent_transform: False
          brightness: 0.1
          contrast: 0.05
          saturation: 0.05
          hue: null
        - _target_: training.dataset.transforms.ToTensorAPI
        - _target_: training.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

  val_transforms:
    - _target_: training.dataset.transforms.ComposeAPI
      transforms:
        - _target_: training.dataset.transforms.RandomResizeAPI
          sizes: ${scratch.resolution}
          square: true
          consistent_transform: True
        - _target_: training.dataset.transforms.ToTensorAPI
        - _target_: training.dataset.transforms.NormalizeAPI
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

trainer:
  _target_: training.trainer.Trainer
  mode: train
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  accelerator: cuda
  seed_value: 123

  model:
    _target_: training.model.sam2.SAM2Train
    image_encoder:
      _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
      scalp: 1
      trunk:
        _target_: sam2.modeling.backbones.hieradet.Hiera
        embed_dim: 112
        num_heads: 2
        drop_path_rate: 0.1
      neck:
        _target_: sam2.modeling.backbones.image_encoder.FpnNeck
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 256
          normalize: true
          scale: null
          temperature: 10000
        d_model: 256
        backbone_channel_list: [896, 448, 224, 112]
        fpn_top_down_levels: [2, 3]
        fpn_interp_model: nearest

    memory_attention:
      _target_: sam2.modeling.memory_attention.MemoryAttention
      d_model: 256
      pos_enc_at_input: true
      layer:
        _target_: sam2.modeling.memory_attention.MemoryAttentionLayer
        activation: relu
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        self_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
        d_model: 256
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        cross_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          kv_in_dim: 64
      num_layers: 4

    memory_encoder:
        _target_: sam2.modeling.memory_encoder.MemoryEncoder
        out_dim: 64
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 64
          normalize: true
          scale: null
          temperature: 10000
        mask_downsampler:
          _target_: sam2.modeling.memory_encoder.MaskDownSampler
          kernel_size: 3
          stride: 2
          padding: 1
        fuser:
          _target_: sam2.modeling.memory_encoder.Fuser
          layer:
            _target_: sam2.modeling.memory_encoder.CXBlock
            dim: 256
            kernel_size: 7
            padding: 3
            layer_scale_init_value: 1e-6
            use_dwconv: True
          num_layers: 2

    num_maskmem: 7
    image_size: ${scratch.resolution}
    sigmoid_scale_for_mem_enc: 20.0
    sigmoid_bias_for_mem_enc: -10.0
    use_mask_input_as_output_without_sam: false
    directly_add_no_mem_embed: true
    no_obj_embed_spatial: true
    use_high_res_features_in_sam: true
    multimask_output_in_sam: true
    iou_prediction_use_sigmoid: True
    use_obj_ptrs_in_encoder: true
    add_tpos_enc_to_obj_ptrs: true
    proj_tpos_enc_in_obj_ptrs: true
    use_signed_tpos_enc_to_obj_ptrs: true
    only_obj_ptrs_in_the_past_for_eval: true
    pred_obj_scores: true
    pred_obj_scores_mlp: true
    fixed_no_obj_ptr: true
    multimask_output_for_tracking: true
    use_multimask_token_for_obj_ptr: true
    multimask_min_pt_num: 0
    multimask_max_pt_num: 1
    use_mlp_for_obj_ptr_proj: true

    # === BNDL_CONFIG_START ===
    # BNDL (always uses hyper_in only mode)
    use_bndl_for_pixels: true
    use_ur_ern_for_pixels: false
    sam_mask_decoder_extra_args:
      bndl_factor_z: 0.0
      bndl_factor_w: 0.0
    # === BNDL_CONFIG_END ===

    # AUE disabled
    use_aue: false

    # DSU enabled (non-adversarial baseline)
    use_dsu: true
    dsu_p: 0.5
    dsu_alpha: 0.5

    # Freeze image encoder
    freeze_image_encoder: true
    freeze_image_encoder_epochs: 20

    # === LORA_CONFIG_START ===
    use_lora: false
    lora_rank: 4
    lora_alpha: 16.0
    lora_dropout: 0.1
    lora_target_modules:
      - "qkv"
      - "proj"
    # === LORA_CONFIG_END ===

    # === MAX_OBJECTS_CONFIG_START ===
    max_num_objects: ${scratch.max_num_objects}
    # === MAX_OBJECTS_CONFIG_END ===

    # === AUE_GCN_CONFIG_START ===
    # AUE disabled for this baseline
    # === AUE_GCN_CONFIG_END ===

    ####### Training specific params #######
    prob_to_use_pt_input_for_train: 0.5
    prob_to_use_pt_input_for_eval: 0.0
    prob_to_use_box_input_for_train: 0.5
    prob_to_use_box_input_for_eval: 0.0
    prob_to_sample_from_gt_for_train: 0.1
    num_frames_to_correct_for_train: 2
    num_frames_to_correct_for_eval: 1
    rand_frames_to_correct_for_train: True
    add_all_frames_to_correct_as_cond: True
    num_init_cond_frames_for_train: 2
    rand_init_cond_frames_for_train: True
    num_correction_pt_per_frame: 7
    use_act_ckpt_iterative_pt_sampling: false
    num_init_cond_frames_for_eval: 1
    forward_backbone_per_frame_for_eval: True

  data:
    train:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      batch_sizes:
        - ${scratch.train_batch_size}
      datasets:
        - _target_: training.dataset.utils.RepeatFactorWrapper
          dataset:
            _target_: training.dataset.utils.ConcatDataset
            datasets:
            - _target_: training.dataset.vos_dataset.VOSDataset
              transforms: ${vos.train_transforms}
              training: true
              video_dataset:
                _target_: training.dataset.vos_raw_dataset.PNGRawDataset
                img_folder: ${dataset.img_folder}
                gt_folder: ${dataset.gt_folder}
                file_list_txt: ${dataset.file_list_txt}
              sampler:
                _target_: training.dataset.vos_sampler.RandomUniformSampler
                num_frames: ${scratch.num_frames}
                max_num_objects: ${scratch.max_num_objects}
              multiplier: ${dataset.multiplier}
      shuffle: True
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      persistent_workers: True
      prefetch_factor: 2
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all

    val:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: 1
      batch_sizes:
        - 1
      datasets:
        - _target_: training.dataset.vos_dataset.VOSDataset
          transforms: ${vos.val_transforms}
          training: false
          video_dataset:
            _target_: training.dataset.vos_raw_dataset.PNGRawDataset
            img_folder: ${dataset.val_img_folder}
            gt_folder: ${dataset.val_gt_folder}
            file_list_txt: ${dataset.val_file_list_txt}
          sampler:
            _target_: training.dataset.vos_sampler.RandomUniformSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
          multiplier: ${dataset.val_multiplier}
      shuffle: False
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: False
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: val

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers:
      - _target_: training.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: 0.9
        apply_to: 'image_encoder.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0
    options:
      lr:
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.base_lr}
            end_value: ${divide:${scratch.base_lr},10}
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: 1.0e-4
            end_value: 1.0e-5
          param_names:
            - 'sam_mask_decoder.pixel_bndl.*'
          optional: true
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.vision_lr}
            end_value: ${divide:${scratch.vision_lr},10}
          param_names:
            - image_encoder.*
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.1
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          module_cls_names: ['torch.nn.LayerNorm']
          exclude_param_names: ['*bias*']

  loss:
    all:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss:
        _target_: training.loss_fns.MultiStepMultiMasksAndIous
        weight_dict:
          loss_mask: 20.0
          loss_dice: 1.0
          loss_iou: 1.0
          loss_class: 1.0
        supervise_all_iou: true
        iou_use_l1_loss: true
        pred_obj_scores: true
        focal_gamma_obj_score: 0.0
        focal_alpha_obj_score: -1.0
      bndl_loss:
        _target_: training.loss_bndl.BNDLLoss
        kl_weight: 1e-11
        kl_weight_x: 1e-11
        kl_weight_w: 1e-11
        prior_gamma_shape: 1.0
        prior_gamma_scale: 3.0
        ur_weight: 0.0
      sam_weight: 1.0
      bndl_weight: 0.05
      # No AUE/MMD loss for non-adversarial baseline
      weight_schedule:
        - until_epoch: 2
          bndl_weight: 0.0
        - until_epoch: 4
          bndl_weight: 0.05
        - until_epoch: null
          bndl_weight: 0.1
    val:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss: ${trainer.loss.all.sam_loss}
      bndl_loss: ${trainer.loss.all.bndl_loss}
      sam_weight: 1.0
      bndl_weight: 1.0
      prefix_keys: False

  distributed:
    backend: nccl
    find_unused_parameters: True

  logging:
    tensorboard_writer:
      _target_: training.utils.logger.make_tensorboard_logger
      log_dir:  ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 5
      should_log: True
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10
    log_scalar_frequency: 10
    visualize_bndl: false
    uncertainty_metric: ["entropy", "nll"]
    enable_pavpu_eval: true
    uncertainty_sample_num: 50
    correlation_foreground_dilation: 12
    correlation_per_pixel: true
    correlation_use_full_image: false

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0
    model_weight_initializer:
      _partial_: True
      _target_: training.utils.checkpoint_utils.load_state_dict_into_model
      strict: False
      ignore_missing_keys: []
      ignore_unexpected_keys: []
      checkpoint_kernels:
        - _target_: training.utils.checkpoint_utils.CkptExcludeKernel
          key_pattern:
            - 'sam_mask_decoder.output_hypernetworks_mlps.*'
      state_dict:
        _target_: training.utils.checkpoint_utils.load_checkpoint_and_apply_kernels
        checkpoint_path: ${oc.env:PROJECT_HOME}/dev/ada_samp/sam2/checkpoints/sam2.1_hiera_base_plus.pt
        ckpt_state_dict_keys: ['model']

launcher:
  num_nodes: 1
  gpus_per_node: 8
  experiment_log_dir: ${oc.env:PROJECT_HOME}/dev/ada_samp/logs/sam2/sam2_bndl_dsu

submitit:
  partition: null
  account: null
  qos: null
  cpus_per_task: 10
  use_cluster: false
  timeout_hour: 24
  name: null
  port_range: [10000, 65000]
