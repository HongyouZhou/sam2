            gt_folder: ${oc.env:PROJECT_HOME}/dev/data/sam2_data/TrashCan_SAM2/val/Annotations
            max_videos: ${scratch.val_max_videos}
          sampler:
            _target_: training.dataset.vos_sampler.RandomUniformSampler
            num_frames: ${scratch.val_num_frames}
