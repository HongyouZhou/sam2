      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: false
      persistent_workers: true
      prefetch_factor: 2
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: val
  optim:
    amp:
      enabled: true
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers:
    - _target_: training.optimizer.layer_decay_param_modifier
      _partial_: true
      layer_decay_value: 0.9
      apply_to: image_encoder.trunk
      overrides:
      - pattern: '*pos_embed*'
        value: 1.0
    options:
      lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: ${scratch.base_lr}
          end_value: ${divide:${scratch.base_lr},10}
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 0.0001
          end_value: 1.0e-05
        param_names:
        - sam_mask_decoder.pixel_bndl.*
        optional: true
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 0.0005
          end_value: 0.0001
        param_names:
        - sam_mask_decoder.ur_ern_head.*
        optional: true
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 0.0001
          end_value: 1.0e-05
        param_names:
        - '*linear_a_*'
        - '*linear_b_*'
        optional: true
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 1.0e-3
          end_value: 1.0e-4
        param_names:
        - 'style_attacker.*'
        - 'deform_attacker.*'
        - 'style_gcn.*'
        optional: true
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: ${scratch.vision_lr}
          end_value: ${divide:${scratch.vision_lr},10}
        param_names:
        - image_encoder.*
      weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.1
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0
        param_names:
        - '*bias*'
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0
        module_cls_names:
        - torch.nn.LayerNorm
        exclude_param_names:
        - '*bias*'
  loss:
    all:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss:
        _target_: training.loss_fns.MultiStepMultiMasksAndIous
        weight_dict:
          loss_mask: 20.0
          loss_dice: 1.0
          loss_iou: 1.0
          loss_class: 1.0
        supervise_all_iou: true
        iou_use_l1_loss: true
        pred_obj_scores: true
        focal_gamma_obj_score: 0.0
        focal_alpha_obj_score: -1.0
      bndl_loss:
        _target_: training.loss_bndl.BNDLLoss
        kl_weight: 0.0
        kl_weight_x: 0.0
        kl_weight_w: 0.0
        prior_gamma_shape: 1.0
        prior_gamma_scale: 3.0
        ur_weight: 0.0
      mmd_loss:
        _target_: training.loss_mmd.MMDCalibrationLoss
        config: ${scratch.mmd_config}
      aue_loss:
        _target_: training.loss_aue.AUELoss
        task_weight: 1.0
        bndl_weight: 0.0
        mmd_weight: 0.0
        cal_weight: 0.2
        mmd_config: ${scratch.mmd_config}
      ur_ern_loss: null
      sam_weight: 1.0
      bndl_weight: 0.0
      mmd_weight: 0.6
      aue_weight: 0.0
      ur_ern_weight: 0.0
      weight_schedule:
      - until_epoch: 4
        bndl_weight: 0.0
        mmd_weight: 0.0
        aue_weight: 0.0
      - until_epoch: 6
        sam_weight: 1.0
        bndl_weight: 0.05
        mmd_weight: 0.0
        aue_weight: 0.0
      - until_epoch: null
        sam_weight: 0.8
        bndl_weight: 0.05
        mmd_weight: 0.0
        aue_weight: 0.2
    val:
      _target_: training.loss_combined.CombinedSAMBNDLLoss
      sam_loss: ${trainer.loss.all.sam_loss}
      bndl_loss: ${trainer.loss.all.bndl_loss}
      mmd_loss: ${trainer.loss.all.mmd_loss}
      aue_loss: ${trainer.loss.all.aue_loss}
      ur_ern_loss: ${trainer.loss.all.ur_ern_loss}
      sam_weight: 1.0
      bndl_weight: 1.0
      mmd_weight: 0.0
      aue_weight: 0.0
      ur_ern_weight: 0.0
