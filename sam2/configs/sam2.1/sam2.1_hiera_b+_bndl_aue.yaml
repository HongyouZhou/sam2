# @package _global_
model:
  _target_: sam2.modeling.sam2_base.SAM2Base
  image_encoder:
    _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
    scalp: 1
    trunk:
      _target_: sam2.modeling.backbones.hieradet.Hiera
      embed_dim: 112
      num_heads: 2
    neck:
      _target_: sam2.modeling.backbones.image_encoder.FpnNeck
      position_encoding:
        _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 256
        normalize: true
        scale: null
        temperature: 10000
      d_model: 256
      backbone_channel_list: [896, 448, 224, 112]
      fpn_top_down_levels: [2, 3]  # output level 0 and 1 directly use the backbone features
      fpn_interp_model: nearest

  memory_attention:
    _target_: sam2.modeling.memory_attention.MemoryAttention
    d_model: 256
    pos_enc_at_input: true
    layer:
      _target_: sam2.modeling.memory_attention.MemoryAttentionLayer
      activation: relu
      dim_feedforward: 2048
      dropout: 0.1
      pos_enc_at_attn: false
      self_attention:
        _target_: sam2.modeling.sam.transformer.RoPEAttention
        rope_theta: 10000.0
        feat_sizes: [64, 64]
        embedding_dim: 256
        num_heads: 1
        downsample_rate: 1
        dropout: 0.1
      d_model: 256
      pos_enc_at_cross_attn_keys: true
      pos_enc_at_cross_attn_queries: false
      cross_attention:
        _target_: sam2.modeling.sam.transformer.RoPEAttention
        rope_theta: 10000.0
        feat_sizes: [64, 64]
        rope_k_repeat: True
        embedding_dim: 256
        num_heads: 1
        downsample_rate: 1
        dropout: 0.1
        kv_in_dim: 64
    num_layers: 4

  memory_encoder:
      _target_: sam2.modeling.memory_encoder.MemoryEncoder
      out_dim: 64
      position_encoding:
        _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 64
        normalize: true
        scale: null
        temperature: 10000
      mask_downsampler:
        _target_: sam2.modeling.memory_encoder.MaskDownSampler
        kernel_size: 3
        stride: 2
        padding: 1
      fuser:
        _target_: sam2.modeling.memory_encoder.Fuser
        layer:
          _target_: sam2.modeling.memory_encoder.CXBlock
          dim: 256
          kernel_size: 7
          padding: 3
          layer_scale_init_value: 1e-6
          use_dwconv: True  # depth-wise convs
        num_layers: 2

  num_maskmem: 7
  image_size: 1024
  # apply scaled sigmoid on mask logits for memory encoder, and directly feed input mask as output mask
  sigmoid_scale_for_mem_enc: 20.0
  sigmoid_bias_for_mem_enc: -10.0
  use_mask_input_as_output_without_sam: false
  # Memory
  directly_add_no_mem_embed: true
  no_obj_embed_spatial: true
  # use high-resolution feature map in the SAM mask decoder
  use_high_res_features_in_sam: true
  # output 3 masks on the first click on initial conditioning frames
  multimask_output_in_sam: true
  # SAM heads
  iou_prediction_use_sigmoid: True
  # cross-attend to object pointers from other frames (based on SAM output tokens) in the encoder
  use_obj_ptrs_in_encoder: true
  add_tpos_enc_to_obj_ptrs: true
  proj_tpos_enc_in_obj_ptrs: true
  use_signed_tpos_enc_to_obj_ptrs: true
  only_obj_ptrs_in_the_past_for_eval: true
  # object occlusion prediction
  pred_obj_scores: true
  pred_obj_scores_mlp: true
  fixed_no_obj_ptr: true
  # multimask tracking settings
  multimask_output_for_tracking: true
  use_multimask_token_for_obj_ptr: true
  multimask_min_pt_num: 0
  multimask_max_pt_num: 1
  use_mlp_for_obj_ptr_proj: true
  # Compilation flag
  compile_image_encoder: False

  # === BNDL_CONFIG_START ===
  # BNDL
  use_bndl_for_pixels: true
  bndl_fuse_type: none
  bndl_replace_global_with_hyper: true
  bndl_hyper_in_sparse: true
  # === BNDL_CONFIG_END ===
  # Compilation flag
  # compile_image_encoder: False
  
  # === MAX_OBJECTS_CONFIG_START ===
  # Max number of objects (matches dataset sampler for memory efficiency)
  max_num_objects: 3
  # === MAX_OBJECTS_CONFIG_END ===
  
  # === LORA_CONFIG_START ===
  # LoRA: Parameter-efficient fine-tuning
  use_lora: false
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.1
  lora_target_modules:  # Layers to inject LoRA
    - "mlp.layers.0"
    - "mlp.layers.1"
  # === CONV_LORA_CONFIG_END ===
  

  # === AUE_GCN_CONFIG_START ===
  # AUE (Adversarial Uncertainty Estimation) with Style-based augmentation
  use_aue: true
  # Constraint weight for adversarial samples (L1 distance to initial)
  aue_constraint_loss_weight: 0.0  # Weight for constraint regularization (0 = disabled)
  # Attack mode: "cooperative" (parallel prediction, joint application) or "sequential" (iterative)
  aue_attack_mode: "cooperative"
  # Style Adversarial options (alternative to AUE, for domain generalization)
  use_style_adv: true
  style_adv_mode: "image_level"  # "image_level" or "feature_level"
  style_adv_use_gt_region_style: true
    
  # Consistency Regularization: MMD(U_clean, U_adv)
  aue_consistency_weight: 0.5  # Weight for consistency loss (0.3-0.7 recommended)
    
  # Multi-object style attack control
  style_adv_use_multi_object: true
  style_adv_enable_background: false
    
  # Global-Local Mixed Style Adversarial
  style_adv_use_global_local_mix: true
  style_adv_global_epsilon: 0.5
  style_adv_global_weight: 0.5

  # GCN-based multi-object style refinement
  style_adv_use_gcn: false  # Not needed for global-only style
  style_adv_gcn_hidden_dim: 64
  style_adv_gcn_num_layers: 2
  style_adv_gcn_edge_threshold: 0.0
  style_adv_gcn_use_semantic_edges: true
  style_adv_gcn_use_background_edges: true
  style_adv_gcn_distance_threshold: 1.0
  style_adv_gcn_use_boundary_distance: true
  style_adv_gcn_use_visual_features: true  # Enable visual features in GCN for content-aware refinement
  style_adv_gcn_feature_dim: 256  # Feature dimension (matches backbone_fpn[-1] d_model)
    
  # Deformation Adversarial (feature-level, memory encoder based)
  use_deform_adv: false  # Disabled for style-only ablation
  deform_adv_epsilon: 5.0  # Reduced from 10.0 to 5.0 for mild spatial perturbation
  deform_adv_use_soft_composite: true
  deform_adv_temperature: 1.0
  deform_adv_use_gcn: false
  deform_adv_gcn_num_layers: 2
  deform_adv_num_deform_groups: 4
  deform_adv_init_from_memory_encoder: true  # Initialize from pretrained memory encoder
  deform_adv_freeze_mask_encoder: false  # Allow fine-tuning
    
  # Adversarial Pipeline Ordering
  adversarial_attack_order: ["style"]  # Only style attack for this ablation
    
  # Distribution matching configuration for AUE calibration loss (nested config)
  aue_dist_matching_config:
    # Current method: Baseline Hard-Aware MMD (error-based Top-K mining)
    method: "mmd"  # Options: "mmd", "cka", "gram", "mmd_hard_aware", "domain_aware_soft_mmd"
        
    # To use NEW theory-driven method, change to:
    # method: "domain_aware_soft_mmd"
        
    use_patches: true  # Ignored for hard-aware methods (inherently patch-based)
    patch_size: 32  # Patch size for patch-based methods
        
    # Method-specific parameters (only active when method is selected)
    mmd:
      kernel: "rbf"
      bandwidth: 0.1
      batch_size: 256
      n_batches: 10
        
    # Baseline: Hard-Aware MMD (error-based Top-K mining)
    mmd_hard_aware:
      top_k_percent: 0.25     # Top 25% hardest patches (by error)
      max_samples: 4096        # Memory optimization
        
    # NEW: Domain-Aware Soft MMD (theory-driven: OOD detection + MaxEnt)
    # Combines error (aleatoric) + feature diversity (epistemic) with soft weighting
    domain_aware_soft_mmd:
      diversity_weight: 0.25       # Reduced from 0.4 to 0.25 (less emphasis on epistemic diversity)
      temperature: 0.2             # Increased from 0.1 to 0.2 (smoother sample selection, less aggressive)
      max_samples: 8192
      diversity_method: "channel_std"  # "channel_std" (faster) | "spatial_var"
      enable_monitoring: false     # Disable monitoring to save memory and ignore low correlation for now
        
    cka:
      use_linear_kernel: true  # Linear kernel (faster) vs RBF kernel
      use_minibatch: true  # Mini-batch computation for memory efficiency
      minibatch_size: 512
        
    gram:
      center: true
      normalize: true
    
  # Analytic uncertainty computation (from Weibull parameters)
  # true = use analytic uncertainty (with gradients to BNDL, bidirectional optimization)
  # false = use sampling uncertainty (detached, gradients only to encoder)
  aue_use_analytic_uncertainty: true
  # === AUE_GCN_CONFIG_END ===
